[package]
name = "victorops"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Endoze <endoze@endozemedia.com>"]
description = "Async Rust client for VictorOps"
license = "MIT"
repository = "https://github.com/endoze/victorops"
keywords = ["victorops", "api", "client", "async", "monitoring"]
categories = ["api-bindings", "asynchronous"]
# Repo tooling isn't part of the crate; keeping it out means CI-only changes
# don't count as package changes and trigger a release.
exclude = [
  ".github/",
  ".coderabbit.yaml",
  ".gitignore",
  "deny.toml",
  "dist-workspace.toml",
  "release-plz.toml",
  "rustfmt.toml",
  "tarpaulin.toml",
]

[dependencies]
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2.0"
url = "2.5"
time = { version = "0.3.55", features = ["parsing"] }

[dev-dependencies]
mockito = "1.7"
time = { version = "0.3.55", features = ["macros"] }
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
